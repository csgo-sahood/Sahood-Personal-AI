<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahood's Assistant | ProGPT_MODv1</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#050505;
 color:#eee;
 font-family:Arial,sans-serif;
 height:100vh;
 overflow:hidden;
}

#matrix{
 position:fixed;
 inset:0;
 z-index:-1;
 opacity:.16;
}

.app{
 height:100vh;
 display:flex;
 flex-direction:column;
 max-width:1000px;
 margin:auto;
 padding:15px;
}

header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:17px;
 border:1px solid #5b1010;
 background:rgba(15,5,5,.94);
 border-radius:12px;
 box-shadow:0 0 18px #790b0b44;
}

.logo{
 font-size:19px;
 font-weight:bold;
 color:#ff2929;
 text-shadow:0 0 12px red;
}

.version{
 font-size:10px;
 color:#999;
 margin-top:5px;
}

.status{
 color:#ff4545;
 font-size:11px;
}

.status:before{
 content:"● ";
 color:#ff2525;
}

.hero{
 text-align:center;
 margin:35px 0 20px;
}

.hero h1{
 color:#ff3030;
 font-size:27px;
 text-shadow:0 0 20px red;
}

.hero p{
 color:#888;
 font-size:12px;
 margin-top:9px;
 letter-spacing:2px;
}

#chat{
 flex:1;
 overflow-y:auto;
 padding:15px 5px;
 display:flex;
 flex-direction:column;
 gap:17px;
}

.message{
 max-width:85%;
 padding:14px;
 border-radius:12px;
 line-height:1.5;
 font-size:14px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.bot{
 align-self:flex-start;
 background:#170909;
 border:1px solid #8b2020;
 box-shadow:0 0 12px #ff000022;
}

.user{
 align-self:flex-end;
 background:#361010;
 border:1px solid #ed2929;
}

.sender{
 font-size:10px;
 color:#ff5151;
 margin-bottom:7px;
 letter-spacing:1px;
}

.typing{
 color:#ff4545;
 font-size:12px;
 padding:10px;
}

.input-area{
 display:flex;
 gap:9px;
 padding:12px;
 background:#100707;
 border:1px solid #772020;
 border-radius:13px;
 box-shadow:0 0 20px #ff000022;
}

textarea{
 flex:1;
 background:transparent;
 color:white;
 border:none;
 outline:none;
 resize:none;
 font-size:14px;
 min-height:42px;
 max-height:110px;
 padding:12px 5px;
}

button{
 background:#c20c0c;
 color:white;
 border:none;
 border-radius:9px;
 padding:0 20px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 12px #ff000066;
}

button:active{
 transform:scale(.95);
}

button:disabled{
 opacity:.5;
}

.footer{
 text-align:center;
 color:#555;
 font-size:10px;
 padding:12px;
 letter-spacing:2px;
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{
 background:#a51b1b;
 border-radius:10px;
}

@media(max-width:500px){
 .hero{margin:25px 0 15px}
 .hero h1{font-size:23px}
 .message{max-width:92%}
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="app">

<header>
 <div>
  <div class="logo">SAHOOD // AI</div>
  <div class="version">PROGPT_MODv1 • VERSION 0.1.0</div>
 </div>
 <div class="status">SYSTEM ONLINE</div>
</header>

<section class="hero">
 <h1>WELCOME BACK</h1>
 <p>PERSONAL INTELLIGENCE SYSTEM</p>
</section>

<div id="chat">
 <div class="message bot">
  <div class="sender">SAHOOD AI</div>
  System initialized successfully.
  <br><br>
  Hello! I am Sahood's Assistant.
  <br>
  How can I help you today?
 </div>
</div>

<div class="input-area">
 <textarea id="input" placeholder="Enter your message..." rows="1"></textarea>
 <button id="send" onclick="sendMessage()">SEND ➤</button>
</div>

<div class="footer">
 SAHOOD'S ASSISTANT • POWERED BY GROQ
</div>

</div>

<script>
// MATRIX BACKGROUND
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
let drops=[];

function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
 drops=Array(Math.ceil(canvas.width/17)).fill(1);
}
resize();
window.addEventListener("resize",resize);

setInterval(()=>{
 ctx.fillStyle="rgba(0,0,0,0.08)";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#ff2020";
 ctx.font="14px monospace";

 drops.forEach((y,i)=>{
  const char=String.fromCharCode(
   0x30A0+Math.random()*96
  );
  ctx.fillText(char,i*17,y*17);
  if(y*17>canvas.height && Math.random()>.97)
   drops[i]=0;
  drops[i]++;
 });
},55);

// CHAT SYSTEM
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");

function addMessage(text,type){
 const box=document.createElement("div");
 box.className="message "+type;

 const sender=document.createElement("div");
 sender.className="sender";
 sender.textContent=type==="user"?"YOU":"SAHOOD AI";

 const content=document.createElement("div");
 content.textContent=text;

 box.append(sender,content);
 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
 return content;
}

async function sendMessage(){
 const message=input.value.trim();
 if(!message || send.disabled)return;

 addMessage(message,"user");
 input.value="";
 send.disabled=true;

 const typing=addMessage("PROCESSING YOUR REQUEST...","bot");

 try{
  const response=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  if(!response.ok)throw new Error("Server error: "+response.status);

  const data=await response.json();
  typing.textContent=data.reply || "No response received.";

 }catch(error){
  typing.textContent="Connection error: "+error.message+
  ". Check that your AI server is running.";
 }

 send.disabled=false;
 chat.scrollTop=chat.scrollHeight;
 input.focus();
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>

</body>
</html>
HTML
